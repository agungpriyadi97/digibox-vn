image:
  name: 'katalonstudio/katalon:11.1.3'
  entrypoint: [""]

stages:
  - test

variables:
  CONTINUE_ON_FAILURE: "true"
  # Corrected to use KATALON_OPTS so the Java runtime engine actually reads it
  KATALON_OPTS: "-Xmx2048m -Xms512m"

katalon_digiboxvn_test:
  stage: test
  tags:
    - infra
  timeout: 12h  
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  
  before_script:
    - rm -rf Reports/* || true
    - rm -rf Screenshot/* || true
    - apt-get update -o Acquire::AllowInsecureRepositories=true -o Doomsday::Ignore=true -y || true
    - apt-get install -y --allow-unauthenticated ffmpeg
    - ffmpeg -version

  script:
    - curl ifconfig.me
    - |
      # ---------- Test Suite Selection ----------
      if [ -z "$TEST_PATH" ]; then
        FINAL_PATH="Test Suites/WEB/Web_Test_Suite_Collection/Regression_Digiboxvn_Web"
        ARG_TYPE="-testSuiteCollectionPath"
      else
        FINAL_PATH=$(echo "$TEST_PATH" | cut -d'=' -f2)
        ARG_TYPE=$(echo "$TEST_PATH" | cut -d'=' -f1)
      fi

      #################################
      # Chrome
      #################################
      CHROME_EXIT=0
      echo "===== Chrome Headless ====="

      katalonc.sh \
        -noSplash \
        -runMode=console \
        -projectPath="$CI_PROJECT_DIR/digibox-vn.prj" \
        -retry=0 \
        -apiKey="$KATALON_API_KEY" \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Chrome (headless)" \
        -reportFolder="Reports/Chrome_Reports" \
        -reportFileName="Chrome_Report" \
        --config \
        -webui.autoUpdateDrivers=true \
        -webui.chrome.args="--disable-dev-shm-usage,--no-sandbox" \
        || CHROME_EXIT=$?

      #################################
      # Firefox (Fixed Memory Overrides)
      #################################
      FIREFOX_EXIT=0
      echo "===== Firefox Headless ====="

      katalonc.sh \
        -noSplash \
        -runMode=console \
        -projectPath="$CI_PROJECT_DIR/digibox-vn.prj" \
        -retry=0 \
        -apiKey="$KATALON_API_KEY" \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Firefox (headless)" \
        -reportFolder="Reports/Firefox_Reports" \
        -reportFileName="Firefox_Report" \
        --config \
        -webui.autoUpdateDrivers=true \
        --args="-profile-mini" \
        || FIREFOX_EXIT=$?

      #################################
      # Summary & Final Assessment
      #################################
      echo ""
      echo "========== RESULT =========="
      echo "Chrome  : $CHROME_EXIT"
      echo "Firefox : $FIREFOX_EXIT"

      # Execute video clean-up INSIDE the script block before exiting
      echo "Cleaning old videos..."
      find Reports/ -type f -name "*.mp4" -mtime +30 -exec rm -f {} \; || true

      PIPELINE_EXIT=0
      [ "$CHROME_EXIT" -ne 0 ] && PIPELINE_EXIT=1
      [ "$FIREFOX_EXIT" -ne 0 ] && PIPELINE_EXIT=1

      if [ "$PIPELINE_EXIT" -eq 0 ]; then
        echo "Pipeline PASSED"
      else
        echo "Pipeline FAILED"
      fi

      exit $PIPELINE_EXIT

  artifacts:
    when: always
    paths:
      - Reports/
      - Screenshot/
    expire_in: 2 mos
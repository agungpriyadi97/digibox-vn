image:
  name: katalonstudio/katalon:11.1.3
  entrypoint: [""]

stages:
  - test

variables:
  GS_OPTIONS: "-Xmx4096m -Xms1024m -Djava.shm.size=4g"

katalon_digiboxvn_test:
  stage: test

  tags:
    - infra

  timeout: 12h

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

  before_script:

    # Cleanup
    - rm -rf Reports/* || true
    - rm -rf Screenshot/* || true

    - mkdir -p Reports
    - mkdir -p Screenshot

    # Dependency
    - apt-get update || true
    - apt-get install -y xvfb ffmpeg curl || true

    # Diagnostic
    - google-chrome --version || true
    - chromedriver --version || true
    - firefox --version || true
    - geckodriver --version || true

    - ffmpeg -version || true

    - curl -s ifconfig.me || true

    # Project Validation
    - ls -la
    - test -f "$CI_PROJECT_DIR/digibox-vn.prj"

  script:

    - |

      echo "====================================="
      echo "DIGIBOX VN AUTOMATION START"
      echo "====================================="

      if [ -z "$TEST_PATH" ]; then

        export FINAL_PATH="Test Suites/WEB/Web_Test_Suite_Collection/Regression_Digiboxvn_Web"
        export ARG_TYPE="-testSuiteCollectionPath"

      else

        export FINAL_PATH=$(echo "$TEST_PATH" | cut -d'=' -f2)
        export ARG_TYPE=$(echo "$TEST_PATH" | cut -d'=' -f1)

      fi

      echo "$ARG_TYPE=$FINAL_PATH"

      ##################################################
      # Chrome
      ##################################################

      CHROME_EXIT=0

      mkdir -p Reports/Chrome_Reports

      katalonc.sh \
      -noSplash \
      -runMode=console \
      -projectPath="$CI_PROJECT_DIR/digibox-vn.prj" \
      -retry=0 \
      -apiKey="$KATALON_API_KEY" \
      "$ARG_TYPE=$FINAL_PATH" \
      -browserType="Chrome (headless)" \
      -reportFolder="Reports/Chrome_Reports" \
      -reportFileName="Chrome_Report" \
      --config \
      -webui.autoUpdateDrivers=true \
      -webui.chrome.args="--headless=new --disable-blink-features=AutomationControlled --remote-allow-origins=* --disable-dev-shm-usage --disable-gpu --disable-extensions --disable-popup-blocking --disable-infobars --disable-background-networking --disable-renderer-backgrounding --disable-background-timer-throttling --no-sandbox --window-size=1920,1080 --user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0 Safari/537.36" \
      || CHROME_EXIT=$?

      echo "Chrome Exit Code = $CHROME_EXIT"

      ##################################################
      # Firefox
      ##################################################

      FIREFOX_EXIT=0

      mkdir -p Reports/Firefox_Reports

      katalonc.sh \
      -noSplash \
      -runMode=console \
      -projectPath="$CI_PROJECT_DIR/digibox-vn.prj" \
      -retry=0 \
      -apiKey="$KATALON_API_KEY" \
      "$ARG_TYPE=$FINAL_PATH" \
      -browserType="Firefox (headless)" \
      -reportFolder="Reports/Firefox_Reports" \
      -reportFileName="Firefox_Report" \
      --config \
      -webui.autoUpdateDrivers=true \
      -webui.firefox.args="--width=1920 --height=1080" \
      || FIREFOX_EXIT=$?

      echo "Firefox Exit Code = $FIREFOX_EXIT"

      ##################################################
      # Report Validation
      ##################################################

      echo "=============================="

      find Reports -type f | head -100 || true

      echo "=============================="

      if [ -d Reports/Chrome_Reports ]; then
        echo "Chrome Report Generated"
      fi

      if [ -d Reports/Firefox_Reports ]; then
        echo "Firefox Report Generated"
      fi

      echo "=============================="

      echo "Chrome Exit : $CHROME_EXIT"

      echo "Firefox Exit : $FIREFOX_EXIT"

      ##################################################
      # Pipeline
      ##################################################

      exit 0

    - find Reports -type f -name "*.mp4" -mtime +30 -exec rm -f {} \; || true

  artifacts:

    when: always

    paths:
      - Reports/
      - Screenshot/

    reports:
      junit:
        - Reports/**/*.xml

    expire_in: 2 mos
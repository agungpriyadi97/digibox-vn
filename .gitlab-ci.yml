image:
  name: katalonstudio/katalon:11.1.3
  entrypoint: [""]

stages:
  - test

variables:
  GS_OPTIONS: "-Xmx4096m -Xms1024m -Djava.shm.size=4g"

katalon_digiboxvn_test:

  stage: test

  tags:
    - infra

  timeout: 12h

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

  before_script:

    # Cleanup
    - rm -rf Reports/* || true
    - rm -rf Screenshot/* || true

    - mkdir -p Reports
    - mkdir -p Screenshot

    # Install Dependency
    - apt-get update || true
    - apt-get install -y xvfb ffmpeg curl || true

    # Diagnostic

    - echo "========== ENVIRONMENT =========="

    - google-chrome --version || true
    - chromedriver --version || true

    - firefox --version || true
    - geckodriver --version || true

    - ffmpeg -version || true

    - curl -s ifconfig.me || true

    - echo "================================="

    # Validate Project

    - ls -la

    - test -f "$CI_PROJECT_DIR/digibox-vn.prj"

  script:

    - |

      echo ""
      echo "=========================================="
      echo " DIGIBOX VN REGRESSION AUTOMATION "
      echo "=========================================="

      #########################################
      # TEST SUITE
      #########################################

      if [ -z "$TEST_PATH" ]; then

        FINAL_PATH="Test Suites/WEB/Web_Test_Suite_Collection/Regression_Digiboxvn_Web"

        ARG_TYPE="-testSuiteCollectionPath"

      else

        FINAL_PATH=$(echo "$TEST_PATH" | cut -d'=' -f2)

        ARG_TYPE=$(echo "$TEST_PATH" | cut -d'=' -f1)

      fi

      echo ""
      echo "Execution Target"

      echo "$ARG_TYPE=$FINAL_PATH"

      CHROME_EXIT=0

      FIREFOX_EXIT=0

      #########################################
      # CHROME EXECUTION
      #########################################

      echo ""
      echo "=========================================="
      echo "START CHROME HEADLESS"
      echo "=========================================="

      mkdir -p Reports/Chrome_Reports

      katalonc.sh \
      -noSplash \
      -runMode=console \
      -projectPath="$CI_PROJECT_DIR/digibox-vn.prj" \
      -retry=0 \
      -apiKey="$KATALON_API_KEY" \
      "$ARG_TYPE=$FINAL_PATH" \
      -browserType="Chrome (headless)" \
      -reportFolder="Reports/Chrome_Reports" \
      -reportFileName="Chrome_Report" \
      --config \
      -webui.autoUpdateDrivers=true \
      -webui.chrome.args="\
      --headless=new \
      --no-sandbox \
      --disable-dev-shm-usage \
      --disable-gpu \
      --disable-extensions \
      --disable-popup-blocking \
      --disable-infobars \
      --disable-background-networking \
      --disable-renderer-backgrounding \
      --disable-background-timer-throttling \
      --disable-blink-features=AutomationControlled \
      --remote-allow-origins=* \
      --window-size=1920,1080 \
      --user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0 Safari/537.36" \
      || CHROME_EXIT=$?

      echo ""
      echo "=========================================="
      echo "CHROME FINISHED"
      echo "=========================================="

      echo "Chrome Exit Code : $CHROME_EXIT"

      if [ "$CHROME_EXIT" -eq 0 ]; then
          echo "Chrome Result : PASSED"
      else
          echo "Chrome Result : FAILED"
      fi

            #########################################
      # FIREFOX EXECUTION
      #########################################

      echo ""
      echo "=========================================="
      echo "START FIREFOX HEADLESS"
      echo "=========================================="

      mkdir -p Reports/Firefox_Reports

      katalonc.sh \
      -noSplash \
      -runMode=console \
      -projectPath="$CI_PROJECT_DIR/digibox-vn.prj" \
      -retry=0 \
      -apiKey="$KATALON_API_KEY" \
      "$ARG_TYPE=$FINAL_PATH" \
      -browserType="Firefox (headless)" \
      -reportFolder="Reports/Firefox_Reports" \
      -reportFileName="Firefox_Report" \
      --config \
      -webui.autoUpdateDrivers=true \
      -webui.firefox.args="--width=1920 --height=1080" \
      || FIREFOX_EXIT=$?

      echo ""
      echo "=========================================="
      echo "FIREFOX FINISHED"
      echo "=========================================="

      echo "Firefox Exit Code : $FIREFOX_EXIT"

      if [ "$FIREFOX_EXIT" -eq 0 ]; then
          echo "Firefox Result : PASSED"
      else
          echo "Firefox Result : FAILED"
      fi

            ##################################################
      # REPORT VALIDATION
      ##################################################

      echo ""
      echo "=========================================="
      echo "REPORT VALIDATION"
      echo "=========================================="

      echo ""
      echo "Generated Report Files :"

      find Reports -type f | sort || true

      echo ""

      if [ -d "Reports/Chrome_Reports" ]; then
          echo "Chrome Report  : GENERATED"
      else
          echo "Chrome Report  : NOT FOUND"
      fi

      if [ -d "Reports/Firefox_Reports" ]; then
          echo "Firefox Report : GENERATED"
      else
          echo "Firefox Report : NOT FOUND"
      fi

      ##################################################
      # EXECUTION SUMMARY
      ##################################################

      echo ""
      echo "=========================================="
      echo "EXECUTION SUMMARY"
      echo "=========================================="

      echo ""

      printf "%-12s : %s\n" "Chrome" "$CHROME_EXIT"
      printf "%-12s : %s\n" "Firefox" "$FIREFOX_EXIT"

      echo ""

      if [ "$CHROME_EXIT" -eq 0 ]; then
          echo "Chrome  : PASSED"
      else
          echo "Chrome  : FAILED"
      fi

      if [ "$FIREFOX_EXIT" -eq 0 ]; then
          echo "Firefox : PASSED"
      else
          echo "Firefox : FAILED"
      fi

      ##################################################
      # PIPELINE RESULT
      ##################################################

      PIPELINE_EXIT=0

      if [ "$CHROME_EXIT" -ne 0 ]; then
          PIPELINE_EXIT=1
      fi

      if [ "$FIREFOX_EXIT" -ne 0 ]; then
          PIPELINE_EXIT=1
      fi

      echo ""
      echo "=========================================="

      if [ "$PIPELINE_EXIT" -eq 0 ]; then

          echo "ALL EXECUTIONS PASSED"

      else

          echo "ONE OR MORE EXECUTIONS FAILED"

      fi

      echo "=========================================="

      exit $PIPELINE_EXIT

  - |

      echo ""
      echo "Cleaning old video..."

      find Reports \
      -type f \
      -name "*.mp4" \
      -mtime +30 \
      -exec rm -f {} \; \
      || true

artifacts:

  when: always

  paths:
    - Reports/
    - Screenshot/

  reports:

    junit:

      - Reports/**/*.xml

  expire_in: 2 mos